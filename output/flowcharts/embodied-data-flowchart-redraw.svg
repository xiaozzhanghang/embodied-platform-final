<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2000" viewBox="0 0 1440 2000" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">具身数据采集、质检、标注与审核流程图</title>
  <desc id="diagram-desc">从具身数据采集需求开始，经过采集或关联资产、数据质检、数据标注与审核，最终将合格数据归档入库。</desc>

  <defs>
    <pattern id="minor-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#dfe5ed" stroke-width="1" opacity="0.72"/>
    </pattern>
    <pattern id="major-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor-grid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#cbd4df" stroke-width="1.4" opacity="0.68"/>
    </pattern>
    <linearGradient id="blue-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1484df"/>
      <stop offset="1" stop-color="#0563bb"/>
    </linearGradient>
    <linearGradient id="purple-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa3f2"/>
      <stop offset="1" stop-color="#667bd5"/>
    </linearGradient>
    <linearGradient id="orange-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff856d"/>
      <stop offset="1" stop-color="#f26148"/>
    </linearGradient>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#24466e" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#171717"/>
    </marker>
    <style>
      .node-text {
        fill: #ffffff;
        font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        font-size: 30px;
        font-weight: 650;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .node-text.small { font-size: 27px; }
      .decision-text { font-size: 29px; }
      .edge {
        fill: none;
        stroke: #171717;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .edge.arrow { marker-end: url(#arrow); }
      .branch-label {
        fill: #171717;
        font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        font-size: 27px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .label-bg { fill: #f9fbfd; opacity: 0.96; }
      .blue-node { fill: url(#blue-gradient); stroke: #035aab; stroke-width: 2; filter: url(#node-shadow); }
      .purple-node { fill: url(#purple-gradient); stroke: #6074cc; stroke-width: 2; filter: url(#node-shadow); }
      .orange-node { fill: url(#orange-gradient); stroke: #ea5c43; stroke-width: 2; filter: url(#node-shadow); }
    </style>
  </defs>

  <rect width="1440" height="2000" fill="#f9fbfd"/>
  <rect width="1440" height="2000" fill="url(#major-grid)"/>

  <!-- Main connectors are drawn behind the nodes. -->
  <path id="edge-start-create" class="edge arrow" d="M720 145 V190"/>
  <path id="edge-create-decision" class="edge arrow" d="M720 262 V300"/>

  <path id="edge-collection-yes" class="edge arrow" d="M435 380 H285 V500"/>
  <path id="edge-collection-no" class="edge arrow" d="M1005 380 H1060 V500"/>
  <path id="edge-collection-entry" class="edge arrow" d="M380 604 V650"/>
  <path id="edge-collection-merge-left" class="edge" d="M380 722 V748 H720"/>
  <path id="edge-collection-merge-right" class="edge" d="M1060 604 V748 H720"/>
  <path id="edge-collection-submit" class="edge arrow" d="M720 748 V775"/>

  <path id="edge-submit-qa" class="edge arrow" d="M720 847 V900"/>
  <path id="edge-qa-center-decision" class="edge arrow" d="M720 972 V990"/>
  <path id="edge-qa-no" class="edge arrow" d="M490 1065 H470"/>
  <path id="edge-qa-yes" class="edge arrow" d="M720 1140 V1170"/>

  <path id="edge-qualified-create" class="edge arrow" d="M720 1240 V1270"/>
  <path id="edge-create-workbench" class="edge arrow" d="M720 1370 V1400"/>
  <path id="edge-workbench-submit" class="edge arrow" d="M720 1470 V1505"/>
  <path id="edge-submit-audit" class="edge arrow" d="M720 1579 V1625"/>
  <path id="edge-audit-no" class="edge arrow" d="M470 1700 H445"/>
  <path id="edge-audit-return" class="edge arrow" d="M250 1645 V1435 H515"/>
  <path id="edge-audit-yes" class="edge arrow" d="M720 1775 V1810"/>
  <path id="edge-pass-archive" class="edge arrow" d="M720 1878 V1905"/>

  <!-- Start -->
  <g id="start">
    <title>开始：具身数据采集需求</title>
    <rect class="orange-node" x="445" y="60" width="550" height="85" rx="43"/>
    <text class="node-text" x="720" y="104">开始：具身数据采集需求</text>
  </g>

  <!-- Create collection task -->
  <g id="create-collection-task">
    <title>新建数据采集任务</title>
    <rect class="blue-node" x="480" y="190" width="480" height="72" rx="8"/>
    <text class="node-text" x="720" y="227">新建数据采集任务</text>
  </g>

  <!-- Collection type decision -->
  <g id="collection-type-decision">
    <title>任务类型是否为采集计划？</title>
    <path class="purple-node" d="M720 300 L1005 380 L720 460 L435 380 Z"/>
    <text class="node-text decision-text" x="720" y="363">
      <tspan x="720" dy="-18">任务类型是否为</tspan>
      <tspan x="720" dy="38">采集计划？</tspan>
    </text>
  </g>

  <g aria-label="collection branch labels">
    <rect class="label-bg" x="360" y="337" width="60" height="38" rx="8"/>
    <text class="branch-label" x="390" y="357">是</text>
    <rect class="label-bg" x="1008" y="337" width="230" height="38" rx="8"/>
    <text class="branch-label" x="1123" y="357">否（关联资产）</text>
  </g>

  <!-- Collection-plan branch -->
  <g id="collection-package">
    <title>新建采集分包：配置分包数量 + 分配采集员与质检员</title>
    <rect class="blue-node" x="120" y="500" width="520" height="104" rx="8"/>
    <text class="node-text small" x="380" y="553">
      <tspan x="380" dy="-19">新建采集分包：</tspan>
      <tspan x="380" dy="40">配置分包数量 + 分配采集员与质检员</tspan>
    </text>
  </g>

  <g id="collector-entry">
    <title>采集员录入并完成数据采集</title>
    <rect class="blue-node" x="150" y="650" width="460" height="72" rx="8"/>
    <text class="node-text small" x="380" y="687">采集员录入并完成数据采集</text>
  </g>

  <!-- Asset branch -->
  <g id="asset-package">
    <title>新建资产分包：配置分包数量 + 分配质检员</title>
    <rect class="blue-node" x="800" y="500" width="520" height="104" rx="8"/>
    <text class="node-text small" x="1060" y="553">
      <tspan x="1060" dy="-19">新建资产分包：</tspan>
      <tspan x="1060" dy="40">配置分包数量 + 分配质检员</tspan>
    </text>
  </g>

  <!-- QA -->
  <g id="auto-submit">
    <title>分包数据自动打包并送检</title>
    <rect class="blue-node" x="470" y="775" width="500" height="72" rx="8"/>
    <text class="node-text" x="720" y="812">分包数据自动打包并送检</text>
  </g>

  <g id="qa-center">
    <title>数据质检中心</title>
    <rect class="blue-node" x="555" y="900" width="330" height="72" rx="8"/>
    <text class="node-text" x="720" y="937">数据质检中心</text>
  </g>

  <g id="qa-decision">
    <title>质检是否通过？</title>
    <path class="purple-node" d="M720 990 L950 1065 L720 1140 L490 1065 Z"/>
    <text class="node-text decision-text" x="720" y="1067">质检是否通过？</text>
  </g>

  <g id="qa-reject">
    <title>标记为【未通过】标签（流程终止/无需重采）</title>
    <rect class="blue-node" x="70" y="1015" width="400" height="100" rx="8"/>
    <text class="node-text small" x="270" y="1067">
      <tspan x="270" dy="-18">标记为【未通过】标签</tspan>
      <tspan x="270" dy="39">（流程终止/无需重采）</tspan>
    </text>
  </g>

  <g aria-label="quality branch labels">
    <rect class="label-bg" x="445" y="1016" width="58" height="38" rx="8"/>
    <text class="branch-label" x="474" y="1036">否</text>
    <rect class="label-bg" x="741" y="1134" width="58" height="38" rx="8"/>
    <text class="branch-label" x="770" y="1154">是</text>
  </g>

  <g id="qualified-pool">
    <title>标记合格 · 进入待标注数据池</title>
    <rect class="blue-node" x="445" y="1170" width="550" height="70" rx="8"/>
    <text class="node-text small" x="720" y="1206">标记合格 · 进入待标注数据池</text>
  </g>

  <!-- Annotation -->
  <g id="create-annotation-task">
    <title>新建数据标注任务（指派标注员+审核员）</title>
    <rect class="blue-node" x="485" y="1270" width="470" height="100" rx="8"/>
    <text class="node-text small" x="720" y="1322">
      <tspan x="720" dy="-18">新建数据标注任务</tspan>
      <tspan x="720" dy="39">（指派标注员+审核员）</tspan>
    </text>
  </g>

  <g id="annotation-workbench">
    <title>下发至标注工作台</title>
    <rect class="blue-node" x="515" y="1400" width="410" height="70" rx="8"/>
    <text class="node-text" x="720" y="1436">下发至标注工作台</text>
  </g>

  <g id="annotation-submit">
    <title>标注员完成标注并提交</title>
    <rect class="blue-node" x="470" y="1505" width="500" height="74" rx="8"/>
    <text class="node-text" x="720" y="1543">标注员完成标注并提交</text>
  </g>

  <!-- Audit -->
  <g id="audit-decision">
    <title>数据审核是否通过？</title>
    <path class="purple-node" d="M720 1625 L970 1700 L720 1775 L470 1700 Z"/>
    <text class="node-text decision-text" x="720" y="1702">数据审核是否通过？</text>
  </g>

  <g id="audit-reject">
    <title>弹窗填写不通过理由 → 打回重新标注</title>
    <path class="blue-node" d="M90 1645 H455 L430 1755 H65 Z"/>
    <text class="node-text small" x="260" y="1699">
      <tspan x="260" dy="-18">弹窗填写不通过理由</tspan>
      <tspan x="260" dy="39">→ 打回重新标注</tspan>
    </text>
  </g>

  <g aria-label="audit branch labels">
    <rect class="label-bg" x="438" y="1644" width="58" height="38" rx="8"/>
    <text class="branch-label" x="467" y="1664">否</text>
    <rect class="label-bg" x="741" y="1768" width="58" height="38" rx="8"/>
    <text class="branch-label" x="770" y="1788">是</text>
  </g>

  <g id="audit-pass">
    <title>审核通过 · 验收合格</title>
    <rect class="blue-node" x="510" y="1810" width="420" height="68" rx="8"/>
    <text class="node-text" x="720" y="1845">审核通过 · 验收合格</text>
  </g>

  <g id="archive">
    <title>高质量具身数据集正式归档入库</title>
    <rect class="orange-node" x="400" y="1905" width="640" height="70" rx="35"/>
    <text class="node-text small" x="720" y="1941">高质量具身数据集正式归档入库</text>
  </g>
</svg>
