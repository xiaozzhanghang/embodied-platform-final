        steps.push({
          stepId: `step-${i + 1}`,
          stepNo: i + 1,
          skill: base.skill,
          arm: base.arm,
          object: base.object,
          goal: base.goal,
          startFrame: currentStart,
          endFrame: endF,
          color: base.arm.includes('左') ? '#7c3aed' : (base.arm.includes('双') ? '#0284c7' : '#2563eb'),
          confidence: isRoboticsER ? 0.99 : (isCloud ? 0.979 : base.conf),
          displayConfidence: isRoboticsER ? '99% (极高·具身首选)' : `${Math.round((base.conf || 0.96) * 100)}% (高)`,
          source: sourceLabel,
          stepContent: `${base.content} [${displayModel} 动态切分]`,
          annoOverlap: base.arm.includes('双') ? 1 : 0
        });
        currentStart = endF;
      }
      return steps;
    }

    function App() {
      // 核心状态
      const [currentSample, setCurrentSample] = useState(SAMPLES[0]);
      const [annotationMethod, setAnnotationMethod] = useState('local_qwen'); // 'local_qwen' | 'gemini_flash'
      const [localModel, setLocalModel] = useState('qwen2.5-vl');
      const [cloudModel, setCloudModel] = useState('gemini-robotics-er-2-preview');
      
      // 视频播放状态
      const [currentFrame, setCurrentFrame] = useState(240);
      const [isPlaying, setIsPlaying] = useState(false);
      const [playbackRate, setPlaybackRate] = useState(1.0);
      const [activeCam, setActiveCam] = useState('ego'); // 'ego' | '4cam' | 'right_ego' | 'top'
      
      // 工步与候选
      const [steps, setSteps] = useState(() => generateDynamicSteps('qwen2.5-vl', SAMPLES[0]));
      const [selectedStepId, setSelectedStepId] = useState('step-1');
      
      // 弹窗与抽屉
      const [isPipelineOpen, setIsPipelineOpen] = useState(false);
      const [pipelinePhase, setPipelinePhase] = useState(0);
      const [isCompareOpen, setIsCompareOpen] = useState(false);
      const [isHistoryOpen, setIsHistoryOpen] = useState(false);
      const [isJsonOpen, setIsJsonOpen] = useState(false);
      const [isUploadOpen, setIsUploadOpen] = useState(false);
      const [isEditStepModalOpen, setIsEditStepModalOpen] = useState(false);
      const [editingStep, setEditingStep] = useState(null);

      // 对比弹窗专用选择器
      const [compareLocalModel, setCompareLocalModel] = useState('qwen2.5-vl');
      const [compareCloudModel, setCompareCloudModel] = useState('gemini-robotics-er-2-preview');
      const [compareFilter, setCompareFilter] = useState('all'); // 'all' | 'diff'

      // 版本历史演进
      const [revisions, setRevisions] = useState([
        {
          id: 'rev-101',
          time: '14:20',
          operator: '系统初始化 (方案B基线)',
          summary: '自适应生成 8 个初始动作步骤与半开区间 (100% 覆盖)',
          count: 8
        }
      ]);

      // 播放循环模拟器
      const playTimerRef = useRef(null);
      useEffect(() => {
        if (isPlaying) {
          playTimerRef.current = setInterval(() => {
            setCurrentFrame(prev => {
              const next = prev + Math.round(playbackRate * 2);
              if (next >= currentSample.totalFrames) {
                return 0; // 循环
              }
              return next;
            });
          }, 66); // ~15-30fps 更新
        } else {
          clearInterval(playTimerRef.current);
        }
        return () => clearInterval(playTimerRef.current);
      }, [isPlaying, playbackRate, currentSample.totalFrames]);

      // 切换视频样本
      const handleSwitchSample = (s) => {
        setCurrentSample(s);
        setCurrentFrame(0);
        setIsPlaying(false);
        const activeM = annotationMethod === 'local_qwen' ? localModel : cloudModel;
        const newSteps = generateDynamicSteps(activeM, s);
        setSteps(newSteps);
        setSelectedStepId(newSteps[0]?.stepId || null);
        message.info(`已切换至样本视频：${s.name} (${s.totalFrames} 帧)`);
      };

      // 启动 AI 推理流水线
      const handleRunAiInference = () => {
        setIsPipelineOpen(true);
        setPipelinePhase(0);
        const isCloud = annotationMethod === 'gemini_flash';
        const activeModelName = isCloud 
          ? (cloudModel.includes('er-2') ? 'gemini-robotics-er-2-preview' : 'Gemini 3.8 Flash')
          : localModel;

        const phases = [
          { p: 0, delay: 400 },
          { p: 1, delay: 500 },
          { p: 2, delay: 700 },
          { p: 3, delay: 500 },
          { p: 4, delay: 400 },
          { p: 5, delay: 300 }
        ];

        let currentIdx = 0;
        const runNext = () => {
          if (currentIdx < phases.length) {
            setPipelinePhase(phases[currentIdx].p);
            setTimeout(() => {
              currentIdx++;
              runNext();
            }, phases[currentIdx].delay);
          } else {
            // 完成
            setTimeout(() => {
              setIsPipelineOpen(false);
              const generated = generateDynamicSteps(isCloud ? cloudModel : localModel, currentSample);
              setSteps(generated);
              setSelectedStepId(generated[0]?.stepId || null);

              const newRevId = `rev-${revisions.length + 101}`;
              setRevisions(prev => [
                {
                  id: newRevId,
                  time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
                  operator: isCloud ? `云端直解 (${activeModelName})` : `本地端侧 (${activeModelName})`,
                  summary: `方案B自适应切分生成 ${generated.length} 个工步与时序区间 (100% 覆盖)`,
                  count: generated.length
                },
                ...prev
              ]);

              message.success({
                content: `🎉 ${activeModelName} 推理成功！已输出 ${generated.length} 个工步与时序区间 (0 ~ ${currentSample.totalFrames} 帧 100% 覆盖)`,
                duration: 4
              });
            }, 500);
          }
        };
        runNext();
      };

      // 双模型对比数据
      const compareResult = useMemo(() => {
        const s1 = generateDynamicSteps(compareLocalModel, currentSample);
        const s2 = generateDynamicSteps(compareCloudModel, currentSample);
        const maxLen = Math.max(s1.length, s2.length);
        const rows = [];
        for (let i = 0; i < maxLen; i++) {
          const m1 = s1[i];
          const m2 = s2[i];
          const isDiff = !m1 || !m2 || (m1.startFrame !== m2.startFrame) || (m1.endFrame !== m2.endFrame);
          rows.push({
            key: `row-${i + 1}`,
            stepNo: i + 1,
            skill: m1?.skill || m2?.skill || '作业工步',
            m1,
            m2,
            isDiff,
            diffDesc: !m1 ? '云端宏观整合阶段' : (!m2 ? '本地微观原子细分' : (isDiff ? `云端偏置 ${m2.startFrame - m1.startFrame > 0 ? '+' : ''}${m2.startFrame - m1.startFrame}f` : '时序吻合'))
          });
        }

        let filtered = rows;
        if (compareFilter === 'diff') filtered = rows.filter(r => r.isDiff);

        return {
          method1: {
            name: `方式 1: 本地大模型 (${compareLocalModel})`,
            steps: s1,
            time: '1.5s',
            conf: '97.2%',
            hardware: 'Apple M1 Pro (Metal GPU)',
          },
          method2: {
            name: `方式 2: 云端大模型 (${compareCloudModel.includes('er-2') ? 'gemini-robotics-er-2' : 'Gemini 3.8'})`,
            steps: s2,
            time: '1.1s',
            conf: compareCloudModel.includes('er-2') ? '98.8%' : '97.9%',
            hardware: 'Google Cloud TPU v5e (具身集群)',
          },
          rows: filtered
        };
      }, [compareLocalModel, compareCloudModel, currentSample, compareFilter]);

      // 采纳对比结果
      const handleAdoptMethod = (methodKey) => {
        const adopted = methodKey === 'cloud' ? compareResult.method2.steps : compareResult.method1.steps;
        setSteps(adopted);
        setSelectedStepId(adopted[0]?.stepId || null);
        setIsCompareOpen(false);
        const adoptedName = methodKey === 'cloud' ? compareCloudModel : compareLocalModel;
        message.success(`已成功采纳【${adoptedName}】生成的 ${adopted.length} 个工步结果并注入时间轴！`);
      };

      // 导出报告
      const handleExportReportMd = () => {
        let md = `# 具身智能双模型标注评测报告\n\n`;
        md += `- **样本**: ${currentSample.name} (${currentSample.totalFrames} 帧)\n`;
        md += `- **本地模型**: ${compareLocalModel}\n`;
        md += `- **云端模型**: ${compareCloudModel}\n\n`;
        md += `| 评估维度 | 本地端侧 (${compareLocalModel}) | 云端 (${compareCloudModel}) |\n`;
        md += `| :--- | :--- | :--- |\n`;
        md += `| 推理耗时 | ${compareResult.method1.time} | ${compareResult.method2.time} |\n`;
        md += `| 平均置信度 | ${compareResult.method1.conf} | ${compareResult.method2.conf} |\n`;
        md += `| 工步总数 | ${compareResult.method1.steps.length} 步 | ${compareResult.method2.steps.length} 步 |\n`;
        md += `| 时序覆盖率 | 100.0% | 100.0% |\n\n`;
        md += `### 逐工步对比明细\n`;
        compareResult.rows.forEach(r => {
          md += `- #${r.stepNo} ${r.skill} -> 本地:[${r.m1?.startFrame || '-'}, ${r.m1?.endFrame || '-'}) | 云端:[${r.m2?.startFrame || '-'}, ${r.m2?.endFrame || '-'}) | ${r.diffDesc}\n`;
        });
        const blob = new Blob([md], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `AI标注双模型评估报告-${currentSample.id}.md`;
        a.click();
        URL.revokeObjectURL(url);
      };

      // 导出 JSON 契约
      const handleExportJson = () => {
        const payload = {
          exportVersion: '1.2.0',
          schema: 'EgoAnnotationStandardContract/V2',
          exportedAt: new Date().toISOString(),
          episodeMeta: {
            episodeId: currentSample.id,
            name: currentSample.name,
            totalFrames: currentSample.totalFrames,
            fps: currentSample.fps,
            cameraStreams: ['ego_primary', 'grid_4cam', 'right_wrist', 'top_view']
          },
          annotationSummary: {
            stepCount: steps.length,
            timeCoverage: '100.0%',
            isHalfOpenStrict: true,
            activeEngine: annotationMethod === 'local_qwen' ? localModel : cloudModel
          },
          steps: steps.map(s => ({
            stepNo: s.stepNo,
            arm: s.arm,
            skill: s.skill,
            object: s.object,
            goal: s.goal,
            startFrame: s.startFrame,
            endFrame: s.endFrame,
            confidence: s.confidence,
            source: s.source,
            stepContent: s.stepContent
          }))
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `annotation_contract_${currentSample.id}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      // 获取当前帧对应的工步
      const activeStepInFrame = useMemo(() => {
        return steps.find(s => currentFrame >= s.startFrame && currentFrame < s.endFrame) || steps[0];
      }, [steps, currentFrame]);

      return (
        <div style={{ display: 'flex', flexDirection: 'column', height: '100vh', background: '#0b0f19', color: '#f8fafc' }}>
          
          {/* =========================================================================
              1. 顶部全局导航与模型切换控制栏
              ========================================================================= */}
          <header style={{
            height: 54,
            borderBottom: '1px solid #1e293b',
            background: 'linear-gradient(90deg, #0f172a 0%, #1e1b4b 100%)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            padding: '0 16px',
            flexShrink: 0
          }}>
            {/* 左侧品牌与视频样本切换 */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: 20 }}>🤖</span>
                <span style={{ fontSize: 16, fontWeight: 700, letterSpacing: 0.5, color: '#f8fafc' }}>
                  具身智能数据平台 <span style={{ fontSize: 12, fontWeight: 400, color: '#38bdf8', padding: '1px 6px', background: 'rgba(56, 189, 248, 0.12)', borderRadius: 4, border: '1px solid rgba(56, 189, 248, 0.3)' }}>AI 视频标注工作台</span>
                </span>
              </div>

              <div style={{ width: 1, height: 22, background: '#334155' }} />

              {/* 样本切换 */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ fontSize: 12, color: '#94a3b8' }}>样本视频:</span>
                <Select
                  value={currentSample.id}
                  onChange={(val) => handleSwitchSample(SAMPLES.find(s => s.id === val))}
                  size="small"
                  style={{ width: 220 }}
                  options={SAMPLES.map(s => ({
                    value: s.id,
                    label: <span>{s.name} ({s.durationSec}s)</span>
                  }))}
                />
                <Button
                  size="small"
                  icon={<Icons.Upload />}
                  onClick={() => setIsUploadOpen(true)}
                  style={{ background: '#1e293b', borderColor: '#334155', color: '#38bdf8', fontSize: 12 }}
                >
                  上传本地视频
                </Button>
              </div>
            </div>

            {/* 右侧大模型引擎切换与行动栏 */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              
              {/* 本地端侧模型切换器 */}
              {annotationMethod === 'local_qwen' && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, background: 'rgba(30, 41, 59, 0.8)', padding: '2px 8px', borderRadius: 6, border: '1px solid #334155' }}>
                  <span style={{ fontSize: 12, color: '#93c5fd' }}>本地模型:</span>
                  <Select
                    value={localModel}
                    onChange={setLocalModel}
                    size="small"
                    style={{ width: 170 }}
                    options={MODELS.local.map(m => ({
                      value: m.key,
                      label: <span style={{ fontSize: 12 }}>{m.name}</span>
                    }))}
                  />
                </div>
              )}

              {/* 云端大模型切换器 (含 Google gemini-robotics-er-2) */}
              {annotationMethod === 'gemini_flash' && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, background: 'rgba(46, 16, 101, 0.5)', padding: '2px 8px', borderRadius: 6, border: '1px solid #6b21a8' }}>
                  <Tag color="purple" style={{ margin: 0, fontSize: 10, lineHeight: '18px' }}>Google具身首选</Tag>
                  <Select
                    value={cloudModel}
                    onChange={setCloudModel}
                    size="small"
                    style={{ width: 250 }}
                    options={MODELS.cloud.map(m => ({
                      value: m.key,
                      label: <span style={{ fontSize: 12, fontWeight: m.key.includes('er-2') ? 700 : 400 }}>{m.name}</span>
                    }))}
                  />
                </div>
              )}

              {/* 方式 1 与 方式 2 切换器 */}
              <Segmented
                value={annotationMethod}
                onChange={setAnnotationMethod}
                options={[
                  {
                    value: 'local_qwen',
                    label: (
                      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 12 }}>
                        <Icons.Robot style={{ color: '#38bdf8' }} />
                        <span>方式 1 (本地模型)</span>
                      </span>
                    )
                  },
                  {
                    value: 'gemini_flash',
                    label: (
                      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 12 }}>
                        <Icons.Cloud style={{ color: '#c084fc' }} />
                        <span style={{ fontWeight: 600 }}>方式 2 (云端具身)</span>
                      </span>
                    )
                  }
                ]}
                style={{ background: '#0f172a', border: '1px solid #334155' }}
              />

              {/* 双方式对比弹窗入口 */}
              <Button
                icon={<Icons.Diff />}
                onClick={() => setIsCompareOpen(true)}
                style={{
                  background: '#2e1065',
                  borderColor: '#9333ea',
                  color: '#e9d5ff',
                  fontWeight: 600,
                  fontSize: 12
                }}
              >
                双方式对比 <Tag color="purple" style={{ marginLeft: 4, marginInlineEnd: 0, fontSize: 10 }}>Diff</Tag>
              </Button>

              {/* 启动 AI 推理按钮 */}
              <Button
                type="primary"
                icon={<Icons.Thunderbolt />}
                onClick={handleRunAiInference}
                style={{
                  background: annotationMethod === 'local_qwen'
                    ? 'linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%)'
                    : 'linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%)',
                  borderColor: 'transparent',
                  fontWeight: 700,
                  boxShadow: '0 2px 8px rgba(0,0,0,0.3)',
                  fontSize: 12
                }}
              >
                {annotationMethod === 'local_qwen' ? `启动 ${localModel.split('-')[0]} 推理` : `启动 ${cloudModel.includes('er-2') ? 'gemini-robotics-er-2' : 'Gemini'} 直解`}
              </Button>

              {/* 版本历史 */}
              <Button
                icon={<Icons.History />}
                onClick={() => setIsHistoryOpen(true)}
                style={{ background: '#1e293b', borderColor: '#334155', color: '#94a3b8', fontSize: 12 }}
              >
                版本 ({revisions.length})
              </Button>

              {/* 标准契约 JSON */}
              <Button
                icon={<Icons.Code />}
                onClick={() => setIsJsonOpen(true)}
                style={{ background: '#1e293b', borderColor: '#334155', color: '#94a3b8', fontSize: 12 }}
              >
                契约 JSON
              </Button>
            </div>
          </header>

          {/* =========================================================================
              2. 核心工作区：左侧多视角视频播放器与时间轴，右侧动作工步列表
              ========================================================================= */}
          <div style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>
            
            {/* 左侧：视频与控制台 (宽 68%) */}
            <div style={{ flex: '0 0 68%', display: 'flex', flexDirection: 'column', borderRight: '1px solid #1e293b', background: '#020617' }}>
              
              {/* 视频主播放视窗 */}
              <div style={{ flex: 1, position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#000000', overflow: 'hidden' }}>
                
                {/* 动态仿真机械臂/操作交互 Canvas 视效 */}
                <div style={{ width: '100%', height: '100%', position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  
                  {/* 背景网格 */}
                  <div style={{
                    position: 'absolute',
                    inset: 0,
                    backgroundImage: 'linear-gradient(to right, #111827 1px, transparent 1px), linear-gradient(to bottom, #111827 1px, transparent 1px)',
                    backgroundSize: '40px 40px',
                    opacity: 0.6
                  }} />

                  {/* 仿真交互画面 */}
                  <div style={{ position: 'relative', zIndex: 1, textAlign: 'center' }}>
                    <div style={{
                      width: 440,
                      height: 260,
                      borderRadius: 12,
                      background: 'radial-gradient(circle at center, #1e293b 0%, #090d16 100%)',
                      border: '1px solid #334155',
                      boxShadow: '0 20px 40px rgba(0,0,0,0.8)',
                      display: 'flex',
                      flexDirection: 'column',
                      alignItems: 'center',
                      justifyContent: 'center',
                      padding: 16
                    }}>
                      <div style={{ fontSize: 56, marginBottom: 8, transition: 'all 0.2s transform', transform: isPlaying ? `rotate(${(currentFrame % 30) - 15}deg) scale(1.05)` : 'none' }}>
                        {activeStepInFrame?.arm?.includes('左') ? '🦾' : '🦾'}
                      </div>
                      <div style={{ fontSize: 16, fontWeight: 700, color: '#38bdf8', marginBottom: 4 }}>
                        {activeStepInFrame?.skill} · {activeStepInFrame?.object}
                      </div>
                      <div style={{ fontSize: 12, color: '#94a3b8', maxWidth: 360, lineHeight: 1.4 }}>
                        {activeStepInFrame?.stepContent}
                      </div>
                      <div style={{ marginTop: 12, display: 'flex', gap: 8 }}>
                        <Tag color="cyan">当前帧: {currentFrame} / {currentSample.totalFrames}</Tag>
                        <Tag color="purple">置信度: {activeStepInFrame?.displayConfidence}</Tag>
                      </div>
                    </div>
                  </div>

                  {/* OSD 状态指示角标 */}
                  <div style={{ position: 'absolute', top: 12, left: 16, zIndex: 2, display: 'flex', alignItems: 'center', gap: 8, background: 'rgba(15, 23, 42, 0.75)', padding: '4px 10px', borderRadius: 6, backdropFilter: 'blur(4px)', border: '1px solid rgba(255,255,255,0.1)' }}>
                    <span style={{ width: 8, height: 8, borderRadius: '50%', background: isPlaying ? '#22c55e' : '#eab308' }} className={isPlaying ? 'animate-pulse-slow' : ''} />
                    <span style={{ fontSize: 11, color: '#f8fafc', fontWeight: 600 }}>CAM_RIGHT_EGO · 60FPS RAW</span>
                  </div>

                  <div style={{ position: 'absolute', top: 12, right: 16, zIndex: 2, display: 'flex', gap: 6 }}>
                    {['ego', '4cam', 'right_ego', 'top'].map(cam => (
                      <button
                        key={cam}
                        onClick={() => setActiveCam(cam)}
                        style={{
                          background: activeCam === cam ? '#2563eb' : 'rgba(15, 23, 42, 0.75)',

                          border: '1px solid rgba(255,255,255,0.15)',
                          padding: '3px 8px',
                          borderRadius: 4,
                          fontSize: 11,
                          cursor: 'pointer'
                        }}
                      >
                        {cam === 'ego' ? '主目视角' : (cam === '4cam' ? '四机位网格' : (cam === 'right_ego' ? '右手手腕' : '顶部全景'))}
                      </button>
                    ))}
                  </div>

                  {/* 正在执行工步 Floating 浮层 */}
                  <div style={{ position: 'absolute', bottom: 12, left: '50%', transform: 'translateX(-50%)', zIndex: 2, background: 'rgba(15, 23, 42, 0.85)', padding: '6px 14px', borderRadius: 20, border: '1px solid #3b82f6', display: 'flex', alignItems: 'center', gap: 10, backdropFilter: 'blur(8px)' }}>
                    <span style={{ color: '#38bdf8', fontWeight: 700, fontSize: 13 }}>#{activeStepInFrame?.stepNo} {activeStepInFrame?.skill}</span>
                    <span style={{ color: '#94a3b8', fontSize: 12 }}>{activeStepInFrame?.arm}</span>
                    <Tag color="blue" style={{ margin: 0, fontFamily: 'monospace' }}>[{activeStepInFrame?.startFrame}, {activeStepInFrame?.endFrame}) 帧</Tag>
                  </div>
                </div>
              </div>

              {/* 播放控制条与帧步进 */}
              <div style={{ height: 46, background: '#090d16', borderTop: '1px solid #1e293b', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 16px' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <Button
                    type="primary"
                    shape="circle"
                    size="small"
                    onClick={() => setIsPlaying(!isPlaying)}
                    style={{ background: isPlaying ? '#eab308' : '#2563eb', borderColor: 'transparent' }}
                  >

                        style={{
                          width: `${((s.endFrame - s.startFrame) / currentSample.totalFrames) * 100}%`,
                          height: '100%',
                          background: s.color || '#2563eb',
                          borderRight: '1px solid rgba(0,0,0,0.3)',
                          fontSize: 9,
                          color: '#fff',
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'center',
                          overflow: 'hidden',
                          whiteSpace: 'nowrap'
                        }}
                      >
                        {s.skill}
                      </div>
                    ))}
                  </div>
                </div>

                {/* 轨 2: 云端时间轴 */}
                <div>
                  <div style={{ fontSize: 11, color: '#c4b5fd', marginBottom: 2 }}>【方式 2 · 云端大模型】共 {compareResult.method2.steps.length} 步</div>
                  <div style={{ height: 22, background: '#1e293b', borderRadius: 4, display: 'flex', overflow: 'hidden' }}>
                    {compareResult.method2.steps.map((s, idx) => (
                      <div
                        key={idx}
                        style={{
                          width: `${((s.endFrame - s.startFrame) / currentSample.totalFrames) * 100}%`,
                          height: '100%',
                          background: s.color || '#7c3aed',
                          borderRight: '1px solid rgba(0,0,0,0.3)',
                          fontSize: 9,
                          color: '#fff',
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'center',
                          overflow: 'hidden',
                          whiteSpace: 'nowrap'
                        }}
                      >
                        {s.skill}
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* 逐工步对比表格 */}
              <div style={{ marginBottom: 16 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                  <span style={{ fontWeight: 700, fontSize: 13, color: '#0f172a' }}>逐工步时序与语义对比矩阵</span>
                  <Radio.Group size="small" value={compareFilter} onChange={e => setCompareFilter(e.target.value)}>
                    <Radio.Button value="all">显示全部工步 ({compareResult.rows.length})</Radio.Button>
                    <Radio.Button value="diff">仅看微调差异</Radio.Button>
                  </Radio.Group>
                </div>

                <div style={{ maxHeight: 260, overflowY: 'auto', border: '1px solid #e2e8f0', borderRadius: 6 }}>
                  <table style={{ width: '100%', fontSize: 12, textAlign: 'left', borderCollapse: 'collapse' }}>
                    <thead style={{ background: '#f8fafc', color: '#475569', position: 'sticky', top: 0, zIndex: 1 }}>
                      <tr>
                        <th style={{ padding: '8px 10px', borderBottom: '1px solid #e2e8f0' }}>序号</th>
                        <th style={{ padding: '8px 10px', borderBottom: '1px solid #e2e8f0' }}>工步技能</th>
                        <th style={{ padding: '8px 10px', borderBottom: '1px solid #e2e8f0', color: '#1d4ed8' }}>方式 1 (本地端侧)</th>
                        <th style={{ padding: '8px 10px', borderBottom: '1px solid #e2e8f0', color: '#6d28d9' }}>方式 2 (云端大模型)</th>
                        <th style={{ padding: '8px 10px', borderBottom: '1px solid #e2e8f0' }}>评测结论</th>
                      </tr>
                    </thead>
                    <tbody>
                      {compareResult.rows.map(r => (
                        <tr key={r.key} style={{ borderBottom: '1px solid #f1f5f9' }}>
                          <td style={{ padding: '8px 10px', fontWeight: 700 }}>#{r.stepNo}</td>
                          <td style={{ padding: '8px 10px' }}><Tag color="blue">{r.skill}</Tag></td>
                          <td style={{ padding: '8px 10px' }}>
                            {r.m1 ? (
                              <div>
                                <span style={{ fontFamily: 'monospace', fontWeight: 700, color: '#1d4ed8' }}>[{r.m1.startFrame}, {r.m1.endFrame}) 帧</span>
                                <div style={{ fontSize: 11, color: '#64748b' }}>"{r.m1.stepContent}"</div>
                              </div>
                            ) : <span style={{ color: '#94a3b8' }}>- 本地模型已于相邻工序整合 -</span>}
                          </td>
                          <td style={{ padding: '8px 10px' }}>
                            {r.m2 ? (
                              <div>
                                <span style={{ fontFamily: 'monospace', fontWeight: 700, color: '#6d28d9' }}>[{r.m2.startFrame}, {r.m2.endFrame}) 帧</span>
                                <div style={{ fontSize: 11, color: '#64748b' }}>"{r.m2.stepContent}"</div>
                              </div>
                            ) : <span style={{ color: '#94a3b8' }}>- 云端模型宏观聚合 -</span>}
                          </td>
                          <td style={{ padding: '8px 10px' }}>
                            <Tag color={r.isDiff ? 'orange' : 'green'}>{r.diffDesc}</Tag>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* 采纳决策按钮栏 */}
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#f8fafc', padding: '10px 14px', borderRadius: 8, border: '1px solid #e2e8f0' }}>
                <div style={{ fontSize: 12, color: '#475569' }}>
                  💡 建议：对内网保密要求高建议选<b>方式 1</b>；对触点检测与长程装配精度敏感建议选<b>方式 2 ({compareCloudModel.includes('er-2') ? 'gemini-robotics-er-2' : 'Gemini'})</b>。
                </div>

                <Space size={10}>
                  <Button
                    type="primary"
                    onClick={() => handleAdoptMethod('local')}
                    style={{ background: '#2563eb', fontWeight: 600, fontSize: 12 }}
                  >
                    采纳方式 1 (本地模型结果)
                  </Button>
                  <Button
                    type="primary"
                    onClick={() => handleAdoptMethod('cloud')}
                    style={{ background: '#7c3aed', borderColor: '#7c3aed', fontWeight: 600, fontSize: 12 }}
                  >
                    采纳方式 2 ({compareCloudModel.includes('er-2') ? 'gemini-robotics-er-2' : 'Gemini'} 结果)
                  </Button>
                  <Button onClick={() => setIsCompareOpen(false)} style={{ fontSize: 12 }}>
                    关闭对比
                  </Button>
                </Space>
              </div>
            </div>
          </Modal>

          {/* =========================================================================
              5. 版本历史演进抽屉
              ========================================================================= */}
          <Drawer
            open={isHistoryOpen}
            onClose={() => setIsHistoryOpen(false)}
            title="不可变契约版本历史演进树"
            width={380}
          >
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {revisions.map((rev, idx) => (
                <div key={rev.id} style={{ border: '1px solid #e2e8f0', borderRadius: 8, padding: 12, background: idx === 0 ? '#f0f9ff' : '#ffffff' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
                    <Tag color={idx === 0 ? 'blue' : 'default'} style={{ fontWeight: 700 }}>{rev.id}</Tag>
                    <span style={{ fontSize: 11, color: '#94a3b8' }}>{rev.time}</span>
                  </div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: '#0f172a', marginBottom: 2 }}>{rev.operator}</div>
                  <div style={{ fontSize: 12, color: '#64748b', marginBottom: 6 }}>{rev.summary}</div>
                  <div style={{ fontSize: 11, color: '#16a34a' }}>✓ 包含 {rev.count} 个工步 (100% 覆盖)</div>
                </div>
              ))}
            </div>
          </Drawer>

          {/* =========================================================================
              6. 标准契约 JSON 导出与查看弹窗
              ========================================================================= */}
          <Modal
            open={isJsonOpen}
            onCancel={() => setIsJsonOpen(false)}
            title="EgoAnnotation 标准契约 JSON 预览"
            width={720}
            footer={[
              <Button key="close" onClick={() => setIsJsonOpen(false)}>关闭</Button>,
              <Button key="download" type="primary" icon={<Icons.Download />} onClick={handleExportJson}>下载 JSON 文件</Button>
            ]}
          >
            <div style={{ maxHeight: 420, overflowY: 'auto', background: '#0f172a', color: '#38bdf8', padding: 12, borderRadius: 6, fontFamily: 'monospace', fontSize: 11 }}>
              <pre>{JSON.stringify({
                contractVersion: '1.2.0',
                standard: 'EgoAnnotationStandardContract/V2',
                episodeMeta: {
                  episodeId: currentSample.id,
                  totalFrames: currentSample.totalFrames,
                  fps: currentSample.fps
                },
                activeEngine: annotationMethod === 'local_qwen' ? localModel : cloudModel,
                stepCount: steps.length,
                coverage: '100.0%',
                steps: steps
              }, null, 2)}</pre>
            </div>
          </Modal>

          {/* =========================================================================
              7. 上传本地视频测试弹窗
              ========================================================================= */}
          <Modal
            open={isUploadOpen}
            onCancel={() => setIsUploadOpen(false)}
            title="上传您真实的机器人操作采集视频"
            width={540}
            footer={[
              <Button key="close" onClick={() => setIsUploadOpen(false)}>取消</Button>,
              <Button
                key="preset"
                style={{ borderColor: '#3b82f6', color: '#2563eb' }}
                onClick={() => {
                  const packagingSample = SAMPLES.find(s => s.id === 'packaging_18789') || {
                    id: 'packaging_18789',
                    name: '包装工作台装箱封箱作业 (12ff47c2569ee38535a28c8ac52628c7)',
                    fileName: '12ff47c2569ee38535a28c8ac52628c7.mov',
                    fps: 30,
                    totalFrames: 18789,
                    durationSec: 626.3,
                    type: 'packaging',
                    desc: '现场采录真实装箱封箱视频：手机二维码毫秒级时钟对齐、纸箱撑开与底封、放置珍珠棉底垫、金属滑轨装箱、顶层防震垫与中缝胶带封合、成品码垛。'
                  };
                  handleSwitchSample(packagingSample);
                  setIsUploadOpen(false);
                  message.success('已载入 12ff47c2569ee38535a28c8ac52628c7 真实包装视频 (18,789 帧)！');
                }}
              >
                直接导入 12ff47c2...mov (18,789帧)
              </Button>,
              <Button
                key="submit"
                type="primary"
                onClick={() => {
                  const inputEl = document.getElementById('standalone-file-input');
                  if (inputEl) inputEl.click();
                }}
              >
                选择本地视频文件
              </Button>
            ]}
          >
            <div style={{ padding: '16px 0', textAlign: 'center' }}>
              <input
                type="file"
                id="standalone-file-input"
                accept="video/*"
                style={{ display: 'none' }}
                onChange={(e) => {
                  const file = e.target.files?.[0];
                  if (!file) return;
                  const isPack = file.name.includes('12ff4') || file.name.toLowerCase().includes('pack') || file.size > 100000000;
                  const blobUrl = URL.createObjectURL(file);
                  const custom = {
                    id: `custom_${Date.now().toString().slice(-4)}`,
                    name: file.name,
                    fileName: file.name,
                    videoUrl: blobUrl,
                    fps: 30,
                    totalFrames: isPack ? 18789 : 1829,
                    durationSec: isPack ? 626.3 : 60.0,
                    type: isPack ? 'packaging' : 'sorting',
                    desc: `本地用户现场采录视频: ${file.name} (${(file.size / (1024*1024)).toFixed(1)} MB)`
                  };
                  handleSwitchSample(custom);
                  setIsUploadOpen(false);
                  message.success(`已载入本地视频 ${file.name}！大模型将根据真实画面自适应识别动作工步。`);
                }}
              />
              <div
                onClick={() => {
                  const inputEl = document.getElementById('standalone-file-input');
                  if (inputEl) inputEl.click();
                }}
                style={{ border: '2px dashed #cbd5e1', borderRadius: 8, padding: '32px 16px', background: '#f8fafc', cursor: 'pointer' }}
              >
                <div style={{ fontSize: 36, marginBottom: 8 }}>📹</div>
                <div style={{ fontSize: 14, fontWeight: 600, color: '#0f172a' }}>点击或拖拽您的 MP4 / MOV / WebM 视频至此处</div>
                <div style={{ fontSize: 12, color: '#64748b', marginTop: 4 }}>支持任意时长视频，系统将自动自适应抽帧并执行端到端切分</div>
                <div style={{ marginTop: 12, display: 'inline-block', padding: '4px 12px', background: '#eff6ff', borderRadius: 4, border: '1px solid #bfdbfe', fontSize: 12, color: '#1d4ed8' }}>
                  已内置支持：12ff47c2569ee38535a28c8ac52628c7.mov (18,789 帧 / 10分26秒)
                </div>
              </div>
            </div>
          </Modal>

          {/* =========================================================================
              8. 单工步属性编辑弹窗
              ========================================================================= */}
          <Modal
            open={isEditStepModalOpen}
            onCancel={() => setIsEditStepModalOpen(false)}
            title={`编辑工步 #${editingStep?.stepNo} 属性`}
            onOk={() => {
              if (editingStep) {
                setSteps(steps.map(s => s.stepId === editingStep.stepId ? editingStep : s));
                message.success(`已保存工步 #${editingStep.stepNo} 修改`);
              }
              setIsEditStepModalOpen(false);
            }}
          >
            {editingStep && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 12, padding: '8px 0' }}>
                <div>
                  <span style={{ fontSize: 12, color: '#475569' }}>动作技能 (Skill):</span>
                  <Input
                    value={editingStep.skill}
                    onChange={e => setEditingStep({ ...editingStep, skill: e.target.value })}
                  />
                </div>

                <Row gutter={12}>
                  <Col span={12}>
                    <span style={{ fontSize: 12, color: '#475569' }}>执行机构 (Arm):</span>
                    <Select
                      value={editingStep.arm}
                      onChange={val => setEditingStep({ ...editingStep, arm: val })}
                      style={{ width: '100%' }}
                      options={[
                        { value: '右手 (Right Arm)', label: '右手 (Right Arm)' },
                        { value: '左手 (Left Arm)', label: '左手 (Left Arm)' },
                        { value: '双臂协同 (Dual Arms)', label: '双臂协同 (Dual Arms)' },
                      ]}
                    />
                  </Col>
                  <Col span={12}>
                    <span style={{ fontSize: 12, color: '#475569' }}>操作对象 (Object):</span>
                    <Input
                      value={editingStep.object}
                      onChange={e => setEditingStep({ ...editingStep, object: e.target.value })}
                    />
                  </Col>
                </Row>

                <Row gutter={12}>
                  <Col span={12}>
                    <span style={{ fontSize: 12, color: '#475569' }}>起始帧 (startFrame):</span>
                    <InputNumber
                      value={editingStep.startFrame}
                      onChange={val => setEditingStep({ ...editingStep, startFrame: Number(val) })}
                      style={{ width: '100%' }}
                    />
                  </Col>
                  <Col span={12}>
                    <span style={{ fontSize: 12, color: '#475569' }}>结束帧 (endFrame):</span>
                    <InputNumber
                      value={editingStep.endFrame}
                      onChange={val => setEditingStep({ ...editingStep, endFrame: Number(val) })}
                      style={{ width: '100%' }}
                    />
                  </Col>
                </Row>

                <div>
                  <span style={{ fontSize: 12, color: '#475569' }}>详细动作描述:</span>
                  <Input.TextArea
                    rows={3}
                    value={editingStep.stepContent}
                    onChange={e => setEditingStep({ ...editingStep, stepContent: e.target.value })}
                  />
                </div>
              </div>
            )}
          </Modal>

        </div>
      );
    }

    // 挂载 React 应用程序
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
